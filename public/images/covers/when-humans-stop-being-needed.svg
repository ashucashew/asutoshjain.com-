<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3550"/>
      <stop offset=".5" stop-color="#3c7a8c"/>
      <stop offset=".85" stop-color="#f2b27a"/>
      <stop offset="1" stop-color="#f7c98f"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3d1"/>
      <stop offset=".35" stop-color="#ffd89a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffd89a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4a3e"/><stop offset="1" stop-color="#14231e"/></linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f8ea0"/><stop offset="1" stop-color="#3e5a6a"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="820" cy="610" r="280" fill="url(#sun)"/>
  <circle cx="820" cy="610" r="70" fill="#fff1cc" opacity=".9"/>
  <!-- distant automated city -->
  <g fill="url(#city)" opacity=".75">
    <rect x="980" y="470" width="60" height="180"/><rect x="1050" y="420" width="44" height="230"/><rect x="1100" y="500" width="80" height="150"/>
    <rect x="1190" y="380" width="56" height="270"/><rect x="1256" y="450" width="70" height="200"/><rect x="1336" y="520" width="50" height="130"/>
    <rect x="1396" y="430" width="64" height="220"/><rect x="1470" y="490" width="90" height="160"/>
    <rect x="80" y="520" width="70" height="130"/><rect x="160" y="470" width="50" height="180"/><rect x="220" y="540" width="90" height="110"/>
  </g>
  <g fill="#ffe4a8" opacity=".85">
    <rect x="1060" y="440" width="6" height="6"/><rect x="1076" y="470" width="6" height="6"/><rect x="1204" y="400" width="6" height="6"/><rect x="1222" y="430" width="6" height="6"/>
    <rect x="1204" y="470" width="6" height="6"/><rect x="1410" y="450" width="6" height="6"/><rect x="1430" y="490" width="6" height="6"/><rect x="172" y="500" width="6" height="6"/>
  </g>
  <!-- cranes / robot arms busy in the distance -->
  <g stroke="#2a4656" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M1130 650 V 330 L 1290 300"/><path d="M1130 360 L 1260 310"/><path d="M1290 300 V 360"/>
    <path d="M400 650 V 420 L 330 380 L 290 410"/>
  </g>
  <rect x="1278" y="360" width="24" height="18" fill="#2a4656"/>
  <!-- drones -->
  <g fill="#1f3442">
    <rect x="600" y="250" width="36" height="8" rx="4"/><rect x="590" y="244" width="16" height="4"/><rect x="630" y="244" width="16" height="4"/>
    <rect x="980" y="200" width="30" height="7" rx="3"/><rect x="972" y="195" width="14" height="3"/><rect x="1004" y="195" width="14" height="3"/>
    <rect x="1360" y="270" width="26" height="6" rx="3"/>
  </g>
  <!-- conveyor of boxes on a bridge -->
  <rect x="0" y="640" width="1600" height="16" fill="#28414d"/>
  <g fill="#c98b4f">
    <rect x="70" y="618" width="30" height="22"/><rect x="190" y="618" width="30" height="22"/><rect x="310" y="618" width="30" height="22"/>
    <rect x="980" y="618" width="30" height="22"/><rect x="1100" y="618" width="30" height="22"/><rect x="1220" y="618" width="30" height="22"/><rect x="1340" y="618" width="30" height="22"/><rect x="1460" y="618" width="30" height="22"/>
  </g>
  <!-- foreground grass hill -->
  <path d="M0 720 C 300 680 600 700 820 730 S 1300 700 1600 720 V 1000 H 0Z" fill="url(#ground)"/>
  <!-- tree -->
  <path d="M260 860 C 262 790 250 740 262 700" stroke="#0e1915" stroke-width="16" fill="none"/>
  <circle cx="262" cy="660" r="70" fill="#1f3a30"/><circle cx="210" cy="690" r="50" fill="#1a3229"/><circle cx="315" cy="690" r="54" fill="#1a3229"/>
  <!-- bench + lone person -->
  <g fill="#0b1310">
    <rect x="640" y="800" width="260" height="14" rx="3"/>
    <rect x="640" y="770" width="260" height="10" rx="3"/>
    <rect x="660" y="814" width="10" height="48"/><rect x="870" y="814" width="10" height="48"/>
    <!-- person -->
    <circle cx="760" cy="712" r="22"/>
    <path d="M734 740 q26 -14 52 0 l6 64 h-64Z"/>
    <path d="M736 800 h56 l30 8 v56 h-14 v-44 h-72Z"/>
  </g>
  <!-- empty office chair left behind -->
  <g fill="none" stroke="#0b1310" stroke-width="8" stroke-linecap="round">
    <path d="M1120 820 v-60 q0 -16 16 -16 h40 q16 0 16 16 v40"/>
    <path d="M1110 820 h92"/>
    <path d="M1156 820 v40 M1126 880 l30 -20 l30 20"/>
  </g>
  <rect x="1124" y="804" width="72" height="18" rx="6" fill="#0b1310"/>
  <!-- grass blades -->
  <g stroke="#3e6b55" stroke-width="3" opacity=".6">
    <path d="M100 940 l6 -24 M130 950 l-4 -20 M500 930 l5 -22 M1000 950 l-6 -22 M1400 940 l4 -24 M1480 960 l-5 -18"/>
  </g>
</svg>
