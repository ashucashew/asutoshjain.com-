<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".9">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset=".55" stop-color="#151a2a"/>
      <stop offset="1" stop-color="#090b12"/>
    </radialGradient>
    <radialGradient id="lamp" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a22"/><stop offset="1" stop-color="#1c140f"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#23408a"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5b5b"/><stop offset="1" stop-color="#8a1f2a"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- hanging lamp cone -->
  <path d="M800 0 L 440 760 H 1160 Z" fill="url(#lamp)"/>
  <rect x="796" y="0" width="8" height="70" fill="#0c0e15"/>
  <path d="M740 70 h120 l-20 40 h-80z" fill="#2b2f3a"/>
  <!-- background rising bars (two racing stacks) -->
  <g opacity=".35">
    <rect x="90" y="520" width="40" height="240" fill="url(#blue)"/><rect x="140" y="440" width="40" height="320" fill="url(#blue)"/><rect x="190" y="340" width="40" height="420" fill="url(#blue)"/><rect x="240" y="220" width="40" height="540" fill="url(#blue)"/>
    <rect x="1320" y="540" width="40" height="220" fill="url(#red)"/><rect x="1370" y="450" width="40" height="310" fill="url(#red)"/><rect x="1420" y="330" width="40" height="430" fill="url(#red)"/><rect x="1470" y="230" width="40" height="530" fill="url(#red)"/>
  </g>
  <!-- table -->
  <path d="M260 760 L 1340 760 L 1500 1000 H 100 Z" fill="url(#table)"/>
  <path d="M260 760 L 1340 760" stroke="#6b4c3a" stroke-width="4"/>
  <!-- payoff matrix board on table (perspective) -->
  <g>
    <path d="M560 790 L 1040 790 L 1110 960 L 490 960 Z" fill="#0f1420" stroke="#8fa6d8" stroke-width="3"/>
    <path d="M800 790 L 800 960 M525 875 L 1075 875" stroke="#8fa6d8" stroke-width="3"/>
    <!-- glowing cells -->
    <path d="M800 790 L 1040 790 L 1075 875 L 800 875 Z" fill="#ff9b4a" opacity=".18"/>
    <path d="M525 875 L 800 875 L 800 960 L 490 960 Z" fill="#ff9b4a" opacity=".18"/>
    <path d="M800 875 L 1075 875 L 1110 960 L 800 960 Z" fill="#ff4d5e" opacity=".35" filter="url(#glow)"/>
    <path d="M560 790 L 800 790 L 800 875 L 525 875 Z" fill="#5fffb2" opacity=".22"/>
    <g font-family="Inter, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#e9eefc">
      <text x="675" y="842" font-size="30">3 , 3</text>
      <text x="925" y="842" font-size="30">0 , 5</text>
      <text x="650" y="930" font-size="32">5 , 0</text>
      <text x="955" y="930" font-size="32">1 , 1</text>
    </g>
  </g>
  <!-- left player (silhouette, blue rim light) -->
  <g>
    <path d="M300 760 C 300 610 360 540 450 520 C 540 540 600 610 600 760 Z" fill="#0b0e16"/>
    <circle cx="450" cy="455" r="62" fill="#0b0e16"/>
    <path d="M512 440 a62 62 0 0 1 -10 60" stroke="#6fa2ff" stroke-width="6" fill="none" filter="url(#glow)"/>
    <path d="M598 740 C 596 640 560 570 500 540" stroke="#6fa2ff" stroke-width="5" fill="none" filter="url(#glow)" opacity=".8"/>
    <!-- hand reaching toward a chip token -->
    <path d="M560 700 C 610 720 640 740 680 760" stroke="#0b0e16" stroke-width="40" stroke-linecap="round"/>
  </g>
  <!-- right player (silhouette, red rim light) -->
  <g>
    <path d="M1000 760 C 1000 610 1060 540 1150 520 C 1240 540 1300 610 1300 760 Z" fill="#0b0e16"/>
    <circle cx="1150" cy="455" r="62" fill="#0b0e16"/>
    <path d="M1088 440 a62 62 0 0 0 10 60" stroke="#ff6b6b" stroke-width="6" fill="none" filter="url(#glow)"/>
    <path d="M1002 740 C 1004 640 1040 570 1100 540" stroke="#ff6b6b" stroke-width="5" fill="none" filter="url(#glow)" opacity=".8"/>
    <path d="M1040 700 C 990 720 960 740 920 760" stroke="#0b0e16" stroke-width="40" stroke-linecap="round"/>
  </g>
  <!-- chips on the table -->
  <g>
    <rect x="690" y="740" width="60" height="44" rx="6" fill="#3b4256" stroke="#9aa6c4" stroke-width="2"/>
    <rect x="850" y="740" width="60" height="44" rx="6" fill="#3b4256" stroke="#9aa6c4" stroke-width="2"/>
    <g stroke="#9aa6c4" stroke-width="2">
      <path d="M700 740 v-8 M712 740 v-8 M724 740 v-8 M736 740 v-8 M860 740 v-8 M872 740 v-8 M884 740 v-8 M896 740 v-8"/>
    </g>
    <rect x="706" y="752" width="28" height="20" rx="3" fill="#6fa2ff" opacity=".8"/>
    <rect x="866" y="752" width="28" height="20" rx="3" fill="#ff6b6b" opacity=".8"/>
  </g>
  <!-- hourglass between them -->
  <g transform="translate(800 640)">
    <path d="M-34 -70 h68 M-34 70 h68" stroke="#c9a46a" stroke-width="8" stroke-linecap="round"/>
    <path d="M-28 -66 C -28 -20 28 -20 28 -66 Z M-28 66 C -28 20 28 20 28 66 Z" fill="#e8d4a8" opacity=".25" stroke="#e8d4a8" stroke-width="3"/>
    <path d="M-28 -66 C -28 -20 28 -20 28 -66" fill="none" stroke="#e8d4a8" stroke-width="3"/>
    <path d="M-20 62 C -14 40 14 40 20 62 Z" fill="#ffcf6e"/>
    <path d="M-12 -40 C -6 -30 6 -30 12 -40 Z" fill="#ffcf6e"/>
    <line x1="0" y1="-30" x2="0" y2="40" stroke="#ffcf6e" stroke-width="2"/>
  </g>
</svg>
