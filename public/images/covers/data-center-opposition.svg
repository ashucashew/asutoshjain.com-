<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset=".55" stop-color="#7a3b5c"/>
      <stop offset="1" stop-color="#f0895a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset=".4" stop-color="#ffb46b" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2c4f"/><stop offset="1" stop-color="#2f2040"/></linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23233a"/><stop offset="1" stop-color="#14141f"/></linearGradient>
    <linearGradient id="dcTop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd6e6"/><stop offset="1" stop-color="#9aa3b8"/></linearGradient>
    <linearGradient id="dcFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6378"/><stop offset="1" stop-color="#3a4052"/></linearGradient>
    <linearGradient id="dcSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454c5f"/><stop offset="1" stop-color="#2b303e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1160" cy="560" r="300" fill="url(#sun)"/>
  <g fill="#fff" opacity=".7">
    <circle cx="210" cy="90" r="2"/><circle cx="420" cy="160" r="1.5"/><circle cx="660" cy="70" r="2"/><circle cx="880" cy="130" r="1.4"/><circle cx="1320" cy="80" r="1.8"/><circle cx="1500" cy="170" r="1.3"/><circle cx="100" cy="230" r="1.3"/>
  </g>
  <!-- far hills -->
  <path d="M0 610 C 220 540 380 580 560 560 S 900 520 1100 560 S 1420 540 1600 580 V 1000 H0Z" fill="url(#hillFar)"/>
  <!-- distant data centers (routing around) -->
  <g opacity=".85">
    <rect x="1290" y="520" width="150" height="46" fill="#6c5878"/>
    <rect x="1290" y="512" width="150" height="10" fill="#8f7c9c"/>
    <g fill="#ffd48a"><rect x="1302" y="534" width="10" height="5"/><rect x="1326" y="534" width="10" height="5"/><rect x="1350" y="534" width="10" height="5"/><rect x="1374" y="534" width="10" height="5"/><rect x="1398" y="534" width="10" height="5"/></g>
    <rect x="1462" y="530" width="90" height="34" fill="#6c5878"/>
    <rect x="1462" y="524" width="90" height="8" fill="#8f7c9c"/>
    <!-- gas turbines stack -->
    <rect x="1560" y="490" width="12" height="70" fill="#5a4866"/>
    <path d="M1566 490 c -20 -30 10 -50 -6 -80 c 30 20 20 50 6 80Z" fill="#c7a3b5" opacity=".35"/>
  </g>
  <!-- power line towers -->
  <g stroke="#1d1a2b" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M140 640 L170 420 L200 640 M150 560 L190 560 M140 470 L200 470 M158 500 L182 500"/>
    <path d="M1700 0"/>
    <path d="M520 610 L545 450 L570 610 M528 540 L562 540 M515 485 L575 485"/>
  </g>
  <g stroke="#1d1a2b" stroke-width="2" fill="none" opacity=".9">
    <path d="M140 470 Q 330 540 515 485"/>
    <path d="M200 470 Q 380 545 575 485"/>
    <path d="M575 485 Q 900 560 1290 530"/>
    <path d="M0 440 Q 70 480 140 470"/>
  </g>
  <!-- main data center -->
  <g>
    <polygon points="430,640 980,640 1120,580 570,580" fill="url(#dcTop)"/>
    <rect x="430" y="640" width="550" height="170" fill="url(#dcFront)"/>
    <polygon points="980,640 1120,580 1120,750 980,810" fill="url(#dcSide)"/>
    <!-- rooftop chillers -->
    <g fill="#7a8399">
      <rect x="560" y="596" width="70" height="26" rx="4"/><rect x="660" y="596" width="70" height="26" rx="4"/><rect x="760" y="596" width="70" height="26" rx="4"/><rect x="860" y="596" width="70" height="26" rx="4"/>
    </g>
    <g fill="#3b4256"><circle cx="595" cy="603" r="9"/><circle cx="695" cy="603" r="9"/><circle cx="795" cy="603" r="9"/><circle cx="895" cy="603" r="9"/></g>
    <!-- glowing server slits -->
    <g fill="#7fe3ff" filter="url(#glow)" opacity=".8">
      <rect x="460" y="690" width="490" height="10"/><rect x="460" y="740" width="490" height="10"/>
    </g>
    <g fill="#bff3ff">
      <rect x="460" y="690" width="490" height="6"/><rect x="460" y="740" width="490" height="6"/>
    </g>
    <rect x="680" y="760" width="60" height="50" fill="#22263a"/>
  </g>
  <!-- near hills / foreground -->
  <path d="M0 760 C 260 720 420 800 700 800 S 1200 740 1600 780 V 1000 H0Z" fill="url(#hillNear)"/>
  <!-- road winding away -->
  <path d="M1040 1000 C 1100 900 1180 840 1300 800 S 1480 720 1500 600" stroke="#38344a" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M1040 1000 C 1100 900 1180 840 1300 800 S 1480 720 1500 600" stroke="#f3c97a" stroke-width="3" stroke-dasharray="18 22" fill="none" opacity=".7"/>
  <!-- protest crowd silhouettes + signs -->
  <g fill="#0b0b12">
    <circle cx="180" cy="812" r="16"/><path d="M160 830 h40 l10 120 h-60Z"/>
    <circle cx="260" cy="800" r="17"/><path d="M238 818 h44 l10 140 h-64Z"/>
    <circle cx="340" cy="820" r="15"/><path d="M322 836 h36 l8 120 h-52Z"/>
    <circle cx="420" cy="806" r="16"/><path d="M400 824 h40 l10 130 h-60Z"/>
    <circle cx="96" cy="826" r="14"/><path d="M80 842 h32 l8 120 h-48Z"/>
  </g>
  <g stroke="#0b0b12" stroke-width="6">
    <line x1="104" y1="700" x2="100" y2="840"/><line x1="236" y1="640" x2="232" y2="830"/><line x1="440" y1="660" x2="436" y2="830"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <g transform="rotate(-5 104 690)"><rect x="44" y="664" width="120" height="52" rx="4" fill="#f2efe6"/><text x="104" y="698" font-size="24" fill="#c2412d">NO DC!</text></g>
    <g transform="rotate(4 236 615)"><rect x="160" y="580" width="152" height="70" rx="4" fill="#ffd25e"/><text x="236" y="610" font-size="19" fill="#1b1b26">OUR WATER</text><text x="236" y="636" font-size="19" fill="#1b1b26">OUR GRID</text></g>
    <g transform="rotate(-4 440 640)"><rect x="350" y="612" width="180" height="56" rx="4" fill="#f2efe6"/><text x="440" y="648" font-size="21" fill="#1b1b26">WHO'S IT FOR?</text></g>
  </g>
</svg>
