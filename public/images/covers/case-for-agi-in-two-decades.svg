<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx=".62" cy=".45" r=".85">
      <stop offset="0" stop-color="#3a2a78"/>
      <stop offset=".5" stop-color="#1a1840"/>
      <stop offset="1" stop-color="#0b0c1d"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".25" stop-color="#ffcf6e"/>
      <stop offset=".6" stop-color="#ff8a4c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee0ff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- grid floor -->
  <g stroke="#4b4aa0" stroke-width="1.5" opacity=".35">
    <path d="M0 820 H1600 M0 870 H1600 M0 930 H1600 M0 1000 H1600"/>
    <path d="M990 760 L200 1000 M990 760 L520 1000 M990 760 L840 1000 M990 760 L1160 1000 M990 760 L1480 1000 M990 760 L1800 1000"/>
  </g>
  <!-- spiral of expanding loops (each lap: a better model) -->
  <g fill="none" stroke="url(#ring)" stroke-linecap="round" filter="url(#glow)">
    <ellipse cx="990" cy="430" rx="70" ry="34" stroke-width="4" opacity=".95"/>
    <ellipse cx="990" cy="430" rx="140" ry="66" stroke-width="4" opacity=".8"/>
    <ellipse cx="990" cy="430" rx="230" ry="108" stroke-width="5" opacity=".65"/>
    <ellipse cx="990" cy="430" rx="340" ry="160" stroke-width="5" opacity=".5"/>
    <ellipse cx="990" cy="430" rx="480" ry="226" stroke-width="6" opacity=".35"/>
    <ellipse cx="990" cy="430" rx="650" ry="306" stroke-width="6" opacity=".22"/>
  </g>
  <circle cx="990" cy="430" r="190" fill="url(#core)"/>
  <!-- tokens travelling on rings -->
  <g filter="url(#glow)">
    <circle cx="1130" cy="430" r="9" fill="#fff"/>
    <circle cx="830" cy="508" r="8" fill="#9ff0ff"/>
    <circle cx="1300" cy="355" r="10" fill="#fff"/>
    <circle cx="700" cy="480" r="9" fill="#d3b8ff"/>
    <circle cx="1440" cy="540" r="11" fill="#9ff0ff"/>
    <circle cx="520" cy="360" r="10" fill="#fff"/>
  </g>
  <!-- check marks: verified attempts -->
  <g stroke="#7dffb0" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M1316 300 l12 12 l22 -26"/>
    <path d="M500 310 l12 12 l22 -26"/>
    <path d="M1454 490 l12 12 l22 -26"/>
  </g>
  <g stroke="#ff6b7a" stroke-width="6" stroke-linecap="round" opacity=".7">
    <path d="M300 600 l20 20 M320 600 l-20 20"/>
    <path d="M1540 250 l18 18 M1558 250 l-18 18"/>
  </g>
  <!-- floating code / proof fragments -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#a9a6ff" opacity=".55">
    <text x="90" y="140">theorem step_k : ∀ n, P n → P (n+1)</text>
    <text x="120" y="200">loss ↓ 2.91 → 2.74</text>
    <text x="1180" y="120">assert tests.pass()</text>
    <text x="1210" y="770" opacity=".8">gen n+1 ✓</text>
    <text x="110" y="740" opacity=".8">sample_efficiency × 3</text>
  </g>
  <!-- staircase of model generations -->
  <g fill="#2a2964" stroke="#6f6ee0" stroke-width="2">
    <rect x="120" y="880" width="120" height="120"/><rect x="240" y="840" width="120" height="160"/><rect x="360" y="790" width="120" height="210"/><rect x="480" y="730" width="120" height="270"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="700" font-size="22" fill="#c9c7ff" text-anchor="middle">
    <text x="180" y="925">v1</text><text x="300" y="885">v2</text><text x="420" y="835">v3</text><text x="540" y="775">v4</text>
  </g>
</svg>
